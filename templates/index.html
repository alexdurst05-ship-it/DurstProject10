{% extends "base.html" %}

{% block content %}

<h1>Tax Calculator</h1>

<p>$0 - $1,000: 10%</p>
<p>Above $1,000 - $10,000: 20%</p>
<p>Above $10,000: 30%</p>

<p>Enter your income to calculate your tax.</p>

<form method="post" action="{{ url_for('calculate') }}">

    <label>Income:</label>
    <input type="text" name="income">

    <button type="submit">Calculate</button>

</form>

{% endblock %}
